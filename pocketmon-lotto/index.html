<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오행 픽셀 포켓몬 로또</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #1d2b3a;
    --panel: #f4efd8;
    --panel-2: #e6dfbd;
    --ink: #1a1a1a;
    --muted: #6b6450;
    --line: #1a1a1a;
    --accent: #e3350d;
    --wood: #3f9b4a;
    --fire: #e3350d;
    --earth: #c28a2c;
    --metal: #8f98a3;
    --water: #2f6fd1;
    --font: "Galmuri11", "Galmuri9", "DungGeunMo", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 8px 8px,
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 8px 8px,
      var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  [hidden] { display: none !important; }

  .pixel-art { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* 픽셀 테두리 패널 */
  .panel {
    background: var(--panel);
    border: 4px solid var(--line);
    box-shadow: inset -4px -4px 0 var(--panel-2), 6px 6px 0 rgba(0,0,0,.45);
    padding: 20px;
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 15px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h2::before { content: "▶"; color: var(--accent); font-size: 12px; }

  header.title { text-align: center; color: #fff; }
  header.title h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 32px);
    letter-spacing: 1px;
    text-shadow: 3px 3px 0 var(--accent), 6px 6px 0 #000;
  }
  header.title p { margin: 8px 0 0; color: #b9c6d4; font-size: 13px; }
  .elements-row { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .el-chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 28px; padding: 0 6px;
    border: 3px solid var(--line); color: #fff; font-weight: bold;
    font-size: 14px;
  }
  .el-木 { background: var(--wood); } .el-火 { background: var(--fire); }
  .el-土 { background: var(--earth); } .el-金 { background: var(--metal); }
  .el-水 { background: var(--water); }

  /* 입력 폼 */
  form.birth { display: grid; gap: 14px; }
  .field-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .field { display: grid; gap: 4px; flex: 1 1 160px; min-width: 0; }
  .field label, .opt { font-size: 12px; color: var(--muted); }
  input[type=date], input[type=time], select {
    -webkit-appearance: none; appearance: none;
    display: block; box-sizing: border-box;
    font-family: var(--font); font-size: 15px; line-height: 20px;
    height: 44px; margin: 0; padding: 0 10px; border: 3px solid var(--line); background-color: #fffdf2;
    border-radius: 0; color: var(--ink); width: 100%; min-width: 0;
  }
  /* iOS Safari: 날짜/시각 값 영역이 자체 높이·가운데 정렬을 가지므로 맞춰 준다 */
  input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input[type=date]::-webkit-datetime-edit, input[type=time]::-webkit-datetime-edit { padding: 0; line-height: 20px; }
  select {
    padding-right: 28px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: right 14px center, right 9px center;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  .toggles { display: flex; flex-wrap: wrap; gap: 16px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); font-size: 13px; }
  .opt input { width: 16px; height: 16px; accent-color: var(--accent); }

  .btn {
    font-family: var(--font); font-size: 15px; font-weight: bold;
    padding: 10px 18px; cursor: pointer;
    background: var(--accent); color: #fff;
    border: 3px solid var(--line);
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.3), 3px 3px 0 var(--line);
    transition: transform .05s;
  }
  .btn:active { transform: translate(3px,3px); box-shadow: inset -3px -3px 0 rgba(0,0,0,.3); }
  .btn.secondary { background: #fffdf2; color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .error { color: var(--accent); font-size: 13px; min-height: 1em; margin: 0; }

  /* 사주 팔자 + 오행 바 */
  .pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .pillar { border: 3px solid var(--line); background: #fffdf2; text-align: center; padding: 6px 0 8px; }
  .pillar .cap { font-size: 11px; color: var(--muted); }
  .pillar .ch { display: block; font-size: 22px; line-height: 1.3; }
  .pillar .ch small { font-size: 10px; margin-left: 2px; }
  .pillar.empty .ch { color: #aaa; font-size: 13px; line-height: 1.6; padding: 6px 0; }
  .bars { display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: 34px 1fr 56px; align-items: center; gap: 8px; font-size: 13px; }
  .bar .track { height: 16px; border: 3px solid var(--line); background: #fffdf2; }
  .bar .fill { height: 100%; width: 0; transition: width .8s steps(12); }
  .bar .pct { text-align: right; }
  .bar .bonus { color: var(--accent); font-size: 11px; }
  .meta-line { margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* 기운 요약문 (Typewriter) */
  .dialog {
    border: 4px double var(--line); background: #fffdf2; padding: 14px 16px;
    min-height: 92px; font-size: 15px; position: relative;
  }
  .dialog .caret { display: inline-block; width: 8px; height: 15px; background: var(--ink); vertical-align: -2px; animation: blink .6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 몬스터볼 그리드 */
  .ball-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 480px) {
    .ball-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .reveal img { width: 72px; height: 72px; }
    .panel { padding: 16px 14px; }
  }
  .slot {
    position: relative; aspect-ratio: 1 / 1.15; min-width: 0;
    border: 3px solid var(--line); background: var(--panel-2);
    display: grid; place-items: center; padding: 8px;
  }
  .slot .ball {
    width: 72%; max-width: 110px; cursor: pointer; background: none; border: 0; padding: 0;
    transform-origin: 50% 90%;
  }
  .slot .ball:hover:not(:disabled) { animation: hop .5s steps(4) infinite; }
  .slot .ball:disabled { cursor: default; }
  .slot .ball svg { width: 100%; height: auto; display: block; }
  .slot .no { position: absolute; top: 4px; left: 8px; font-size: 11px; color: var(--muted); }
  @keyframes hop { 50% { transform: translateY(-4px); } }
  /* LLD 6.2 Shake 규격 */
  @keyframes shake {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-15deg); }
    75% { transform: rotate(15deg); }
    100% { transform: rotate(0deg); }
  }
  .slot .ball.shaking { animation: shake .2s steps(4) 3; } /* 3회 × 200ms = 600ms */

  .reveal { display: grid; justify-items: center; gap: 2px; text-align: center; animation: pop .3s ease-out both; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .reveal img { width: 96px; height: 96px; }
  .reveal .pname { font-size: 13px; font-weight: bold; word-break: keep-all; }
  .reveal .pid { font-size: 10px; color: var(--muted); }
  .reveal .el-chip { min-width: 22px; height: 22px; font-size: 12px; border-width: 2px; }

  .lotto {
    display: inline-grid; place-items: center;
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid var(--line); color: #fff; font-weight: bold; font-size: 16px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.5);
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.2), inset 3px 3px 0 rgba(255,255,255,.35);
  }
  .lotto.bounce { animation: bounce .7s cubic-bezier(.3,1.8,.5,1) .15s both; }
  @keyframes bounce { 0% { transform: translateY(-24px) scale(.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .lt-1 { background: #f2b720; } .lt-2 { background: #3d7ee0; } .lt-3 { background: #e04545; }
  .lt-4 { background: #8a8a8a; } .lt-5 { background: #3fa047; }

  /* 결과 카드 */
  #resultCard { background: var(--panel); }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .result-head h2 { margin: 0; }
  .result-head .when { font-size: 11px; color: var(--muted); }
  /* 6개 번호를 항상 한 줄로: 좁은 화면에서는 공 크기를 화면 폭에 맞춰 줄인다 */
  .numbers { display: flex; justify-content: center; flex-wrap: nowrap; gap: 10px; margin: 18px 0; }
  .numbers .lotto { flex: none; width: 50px; height: 50px; font-size: 20px; }
  @media (max-width: 480px) {
    .numbers { gap: 6px; }
    .numbers .lotto {
      width: min(50px, calc((100vw - 104px) / 6)); height: min(50px, calc((100vw - 104px) / 6));
      font-size: min(20px, calc((100vw - 104px) / 15)); border-width: 2px;
    }
  }
  .party { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 560px) { .party { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .party .mon { border: 3px solid var(--line); background: #fffdf2; text-align: center; padding: 4px 2px 6px; font-size: 11px; }
  .party .mon img { width: 64px; height: 64px; display: block; margin: 0 auto; }
  .party .mon b { display: block; font-size: 12px; }
  .result-summary { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  @media (max-width: 480px) {
    .actions { display: grid; grid-template-columns: 1fr 1fr; }
    .actions .btn { min-height: 48px; }
  }
  .toast { text-align: center; font-size: 12px; color: #fff; min-height: 1.4em; margin: 0; }

  footer { color: #8193a6; font-size: 11px; text-align: center; line-height: 1.7; }
</style>
</head>
<body data-state="STATE_INIT">
<div class="wrap">

  <header class="title">
    <h1>오행 픽셀 포켓몬 로또</h1>
    <p>생년월일시의 오행 기운으로 3세대 포켓몬 6마리를 뽑고, 몬스터볼을 여는 순간의 시각으로 로또 번호를 정해요</p>
    <div class="elements-row">
      <span class="el-chip el-木">木</span><span class="el-chip el-火">火</span><span class="el-chip el-土">土</span><span class="el-chip el-金">金</span><span class="el-chip el-水">水</span>
    </div>
  </header>

  <!-- FormInputView -->
  <section class="panel" id="formView">
    <h2>트레이너 정보 입력</h2>
    <form class="birth" id="birthForm" novalidate>
      <div class="field-row">
        <div class="field" style="flex:0 1 120px">
          <label for="calType">달력</label>
          <select id="calType">
            <option value="solar">양력</option>
            <option value="lunar">음력</option>
          </select>
        </div>
        <div class="field">
          <label for="birthDate">생년월일</label>
          <input type="date" id="birthDate" min="1900-01-01" max="2099-12-31" value="1995-05-15" required>
        </div>
        <div class="field">
          <label for="birthTime">태어난 시각</label>
          <input type="time" id="birthTime" value="09:30">
        </div>
      </div>
      <div class="toggles">
        <label class="opt" id="leapWrap" hidden><input type="checkbox" id="isLeap"> 윤달</label>
        <label class="opt"><input type="checkbox" id="timeUnknown"> 태어난 시각 모름</label>
      </div>
      <div class="field-row">
        <button class="btn" type="submit" id="analyzeBtn">분석하기</button>
        <p class="error" id="formError"></p>
      </div>
    </form>
  </section>

  <!-- 사주 분석 결과 -->
  <section class="panel" id="sajuView" hidden>
    <h2>나의 팔자와 오행</h2>
    <div class="pillars" id="pillars"></div>
    <div class="bars" id="bars"></div>
    <p class="meta-line" id="metaLine"></p>
  </section>

  <!-- FortuneCardView -->
  <section class="panel" id="fortuneView" hidden>
    <h2>이번 주의 기운</h2>
    <div class="dialog"><span id="fortuneText"></span><span class="caret" id="caret"></span></div>
  </section>

  <!-- PokéBallGridView -->
  <section class="panel" id="ballView" hidden>
    <h2>몬스터볼을 열어보세요</h2>
    <div class="ball-grid" id="ballGrid"></div>
  </section>

  <!-- ResultCardView -->
  <section id="resultView" hidden>
    <div class="panel" id="resultCard">
      <div class="result-head">
        <h2>이번 주 행운의 번호</h2>
        <span class="when" id="resultWhen"></span>
      </div>
      <div class="numbers" id="resultNumbers"></div>
      <div class="party" id="resultParty"></div>
      <p class="result-summary" id="resultSummary"></p>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn" type="button" id="copyBtn" disabled>번호 복사</button>
      <button class="btn" type="button" id="shareBtn" disabled>공유하기</button>
      <button class="btn secondary" type="button" id="saveBtn" disabled>이미지 저장</button>
      <button class="btn secondary" type="button" id="retryBtn" disabled>다시 하기</button>
    </div>
    <p class="toast" id="toast"></p>
  </section>

  <footer>
    비영리 팬메이드 프로젝트예요. 포켓몬 명칭과 이미지의 권리는 Nintendo · Creatures · GAME FREAK에 있어요.<br>
    스프라이트: PokemonDB (대체: PokeAPI) · 재미로만 즐겨주세요.
  </footer>
</div>

/** @type {{id:number,name:string,engName:string,element:string,type:string,gen:number}[]} */
const PokemonDatabase = RAW_POKEMON.replace(/\s+/g, '').split(';').map((row, i) => {
  const [name, engName, type] = row.split(',');
  const id = i + 1;
  return { id, name, engName, type, element: TYPE_TO_ELEMENT[type], gen: id <= 151 ? 1 : id <= 251 ? 2 : 3 };
});

const ELEMENTS = ['木', '火', '土', '金', '水'];
const ELEMENT_KO = { 木:'나무', 火:'불', 土:'흙', 金:'쇠', 水:'물' };
const ELEMENT_COLOR = { 木:'var(--wood)', 火:'var(--fire)', 土:'var(--earth)', 金:'var(--metal)', 水:'var(--water)' };

/* ================================================================
 * SajuEngine — 만세력 오행 계산 + 이주의 운세 보정 (LLD 4.1)
 * ================================================================ */
const SajuEngine = (() => {
  const GAN = '甲乙丙丁戊己庚辛壬癸';
  const ZHI = '子丑寅卯辰巳午未申酉戌亥';
  const GAN_ELEMENT = { 甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水' };
  const ZHI_ELEMENT = { 寅:'木',卯:'木',巳:'火',午:'火',辰:'土',戌:'土',丑:'土',未:'土',申:'金',酉:'金',亥:'水',子:'水' };
  const WEIGHT_MONTH_ZHI = 30, WEIGHT_DAY_GAN = 20, WEIGHT_OTHER = 8.3, WEEKLY_BONUS = 20;

  const elementOf = ch => GAN_ELEMENT[ch] || ZHI_ELEMENT[ch];
  const hasLunarLib = () => typeof Solar !== 'undefined' && typeof Lunar !== 'undefined';

  // 율리우스 적일 (그레고리력, 정오 기준 정수)
  function jdn(y, m, d) {
    const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  }
  // 일주 천간 (1949-10-01 = 甲子일 기준 검증식)
  const dayGanIndex = (y, m, d) => (jdn(y, m, d) + 9) % 10;

  /** lunar-javascript 로드 실패 시 쓰는 근사 계산 (양력 입력 전용, 절입일은 평균 날짜 사용) */
  function fallbackEightChar(y, m, d, h, mi) {
    const md = m * 100 + d;
    const sajuYear = md < 204 ? y - 1 : y;              // 입춘(2/4 근사) 기준 연도
    const yGan = ((sajuYear - 4) % 10 + 10) % 10;
    const yZhi = ((sajuYear - 4) % 12 + 12) % 12;
    // 절입일 근사: 소한1/6 입춘2/4 경칩3/6 청명4/5 입하5/6 망종6/6 소서7/7 입추8/8 백로9/8 한로10/8 입동11/7 대설12/7
    const TERMS = [106, 204, 306, 405, 506, 606, 707, 808, 908, 1008, 1107, 1207];
    let t = -1;
    for (let i = 0; i < TERMS.length; i++) if (md >= TERMS[i]) t = i;
    // t: -1 → 전년 子월, 0 → 丑월, 1 → 寅월 ...
    const mZhi = ((t + 1) % 12 + 12) % 12;               // 子=0, 丑=1, 寅=2 ...
    const monthOrder = (mZhi - 2 + 12) % 12;              // 寅월 = 0
    const mGan = ((yGan % 5) * 2 + 2 + monthOrder) % 10;
    const dGan = dayGanIndex(y, m, d);
    const dZhi = (jdn(y, m, d) + 1) % 12;
    const hZhi = Math.floor((h + 1) / 2) % 12;
    const hGan = (((dGan + (h >= 23 ? 1 : 0)) % 5) * 2 + hZhi) % 10;  // 23시 야자시는 다음 날 일간 기준
    return {
      year: GAN[yGan] + ZHI[yZhi], month: GAN[mGan] + ZHI[mZhi],
      day: GAN[dGan] + ZHI[dZhi], time: GAN[hGan] + ZHI[hZhi],
    };
  }

  function eightChar({ calType, y, m, d, h, mi, isLeap }) {
    if (hasLunarLib()) {
      const solar = calType === 'lunar'
        ? Lunar.fromYmdHms(y, isLeap ? -m : m, d, h, mi, 0).getSolar()
        : Solar.fromYmdHms(y, m, d, h, mi, 0);
      const ec = solar.getLunar().getEightChar();
      return { year: ec.getYear(), month: ec.getMonth(), day: ec.getDay(), time: ec.getTime(), solar: solar.toYmd(), source: 'lunar-javascript' };
    }
    if (calType === 'lunar') throw new Error('만세력 라이브러리를 불러오지 못해 음력 변환을 할 수 없어요. 양력으로 입력해 주세요.');
    const r = fallbackEightChar(y, m, d, h, mi);
    return { ...r, solar: `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`, source: '내장 근사식' };
  }

  function isoWeek(date) {
    const t = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dow = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dow);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return { year: t.getUTCFullYear(), week: Math.ceil(((t - yearStart) / 86400000 + 1) / 7) };
  }

  /** 이주의 운세: ISO 주차의 월요일 일진(日干) 오행을 이번 주 가산 오행으로 사용 */
  function weeklyElement(now = new Date()) {
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    const { year, week } = isoWeek(now);
    const gan = GAN[dayGanIndex(monday.getFullYear(), monday.getMonth() + 1, monday.getDate())];
    return { element: GAN_ELEMENT[gan], year, week, gan };
  }

  function analyze(input) {
    const ec = eightChar(input);
    const raw = { 木:0, 火:0, 土:0, 金:0, 水:0 };
    const chars = [
      { ch: ec.year[0], w: WEIGHT_OTHER }, { ch: ec.year[1], w: WEIGHT_OTHER },
      { ch: ec.month[0], w: WEIGHT_OTHER }, { ch: ec.month[1], w: WEIGHT_MONTH_ZHI },
      { ch: ec.day[0], w: WEIGHT_DAY_GAN }, { ch: ec.day[1], w: WEIGHT_OTHER },
    ];
    if (!input.timeUnknown) chars.push({ ch: ec.time[0], w: WEIGHT_OTHER }, { ch: ec.time[1], w: WEIGHT_OTHER });
    chars.forEach(({ ch, w }) => { raw[elementOf(ch)] += w; });

    const baseDominant = ELEMENTS.reduce((a, b) => (raw[b] > raw[a] ? b : a));
    const weekly = weeklyElement();
    raw[weekly.element] += WEEKLY_BONUS;

    const total = ELEMENTS.reduce((s, e) => s + raw[e], 0);
    const elementsScore = {};
    ELEMENTS.forEach(e => { elementsScore[e] = Math.round((raw[e] / total) * 1000) / 10; });
    const dominantElement = ELEMENTS.reduce((a, b) => (elementsScore[b] > elementsScore[a] ? b : a));
    const weakestElement = ELEMENTS.reduce((a, b) => (elementsScore[b] < elementsScore[a] ? b : a));

    return {
      birthDate: `${ec.solar} ${input.timeUnknown ? '시각 미상' : `${String(input.h).padStart(2, '0')}:${String(input.mi).padStart(2, '0')}`}`,
      eightChar: ec, elementsScore, dominantElement, baseDominant, weakestElement,
      weeklyBonusElement: weekly.element, weekly, timeUnknown: input.timeUnknown,
      summaryText: '',
    };
  }

  return { analyze, elementOf };
})();

/* ================================================================
 * TextGenerator — 100자 기운 요약문 (LLD 3.2 summaryText)
 * ================================================================ */
const TextGenerator = (() => {
  const NATURE = {
    木: '곧게 뻗는 나무처럼 성장과 도전의 기운이 강하고',
    火: '타오르는 불꽃처럼 열정과 표현력이 넘치며',
    土: '넓은 대지처럼 믿음직하고 중심을 잘 잡으며',
    金: '단단한 쇠처럼 결단력과 원칙이 뚜렷하고',
    水: '깊은 물처럼 지혜롭고 유연하게 흐르며',
  };
  const WEEK = {
    木: '새로운 시작에 행운이 깃들어요.',
    火: '사람들 사이에서 운이 빛나요.',
    土: '꾸준함이 결실로 돌아와요.',
    金: '과감한 선택이 운을 불러요.',
    水: '직감이 행운의 번호를 이끌어요.',
  };
  const LIMIT = 100;

  function generate(r) {
    const parts = [
      `${NATURE[r.baseDominant]}, ${r.weakestElement}(${ELEMENT_KO[r.weakestElement]}) 기운은 조금 약해요.`,
      ` 이번 주는 ${r.weeklyBonusElement}(${ELEMENT_KO[r.weeklyBonusElement]}) 기운이 더해져 ${WEEK[r.weeklyBonusElement]}`,
      ' 몬스터볼을 열어 보세요!',
    ];
    let text = '';
    for (const p of parts) if ((text + p).length <= LIMIT) text += p;
    return text;
  }
  return { generate };
})();

/* ================================================================
 * PokemonGachaEngine — 오행 가중치 룰렛 + 중복 없는 6마리 추첨 (LLD 4.2)
 * ================================================================ */
const PokemonGachaEngine = (() => {
  function rouletteElement(scores, available) {
    const candidates = ELEMENTS.filter(e => available[e] > 0 && scores[e] > 0);
    const sum = candidates.reduce((s, e) => s + scores[e], 0);
    let r = Math.random() * sum;
    for (const e of candidates) { r -= scores[e]; if (r < 0) return e; }
    return candidates[candidates.length - 1];
  }

  function drawSix(scores) {
    const pools = {};
    ELEMENTS.forEach(e => { pools[e] = PokemonDatabase.filter(p => p.element === e); });
    const available = {};
    ELEMENTS.forEach(e => { available[e] = pools[e].length; });

    const picked = [];
    for (let i = 0; i < 6; i++) {
      const element = rouletteElement(scores, available);
      const pool = pools[element];
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);   // 중복 없음
      available[element] = pool.length;
    }
    return picked;
  }
  return { drawSix };
})();

/* ================================================================
 * LottoRngEngine — 도감 번호 + Date.now() 로 번호 산출 (LLD 4.3)
 * ================================================================ */
const LottoRngEngine = {
  compute(pokedexId, clickTimestampLong, existingNumbers) {
    let seed = pokedexId + clickTimestampLong;
    let lottoNumber = (seed % 45) + 1;
    while (existingNumbers.has(lottoNumber)) {
      seed = seed + 1;
      lottoNumber = (seed % 45) + 1;
    }
    existingNumbers.add(lottoNumber);
    return { lottoNumber };
  },
};

/* ================================================================
 * UI Layer
 * ================================================================ */
const $ = id => document.getElementById(id);

const spriteUrl = p => `https://img.pokemondb.net/sprites/black-white/normal/${p.engName}.png`;
const fallbackSpriteUrl = p => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
function spriteImg(p) {
  const img = document.createElement('img');
  img.className = 'pixel-art';
  img.alt = p.name;
  img.src = spriteUrl(p);
  img.dataset.fallback = fallbackSpriteUrl(p);
  img.onerror = () => { if (img.src !== img.dataset.fallback) img.src = img.dataset.fallback; };
  return img;
}
const lottoClass = n => `lt-${Math.min(5, Math.ceil(n / 10))}`;

// 16×16 픽셀 몬스터볼
const POKEBALL_SVG = (() => {
  const rows = [
    '.....KKKKKK.....', '...KKRRRRRRKK...', '..KRRRRRRRRRRK..', '.KRrrRRRRRRRRRK.',
    '.KRrRRRRRRRRRRK.', 'KRRRRRRRRRRRRRRK', 'KRRRRKKKKKKRRRRK', 'KKKKKKWWWWKKKKKK',
    'KWWWWKWWWWKWWWWK', 'KWWWWKKKKKKWWWWK', 'KWWWWWWWWWWWWWWK', '.KWWWWWWWWWWWwK.',
    '.KWWWWWWWWWWwwK.', '..KWWWWWWWwwwK..', '...KKwwwwwwKK...', '.....KKKKKK.....',
  ];
  const color = { K:'#1a1a1a', R:'#e3350d', r:'#ff9a7a', W:'#fafafa', w:'#c9c9c9' };
  let rects = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (color[c]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${color[c]}"/>`;
  }));
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${rects}</svg>`;
})();

const app = {
  state: 'STATE_INIT',
  analysis: null,
  party: [],          // 추첨된 포켓몬 6마리 (ballIndex 순서)
  results: [],        // GachaResultItem[]
  numbers: new Set(),
  typingTimer: null,
  cardBlob: null,     // Promise<Blob> — 결과 카드 이미지
};

function setState(s) {
  app.state = s;
  document.body.dataset.state = s;
}

/* ---------- FormInputView ---------- */
$('calType').addEventListener('change', e => { $('leapWrap').hidden = e.target.value !== 'lunar'; });
$('timeUnknown').addEventListener('change', e => { $('birthTime').disabled = e.target.checked; });

$('birthForm').addEventListener('submit', e => {
  e.preventDefault();
  $('formError').textContent = '';
  const dateStr = $('birthDate').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) { $('formError').textContent = '생년월일을 입력해 주세요.'; return; }
  const [y, m, d] = dateStr.split('-').map(Number);
  if (y < 1900 || y > 2099) { $('formError').textContent = '1900 ~ 2099년 사이로 입력해 주세요.'; return; }
  const timeUnknown = $('timeUnknown').checked;
  const [h, mi] = timeUnknown ? [12, 0] : ($('birthTime').value || '12:00').split(':').map(Number);

  let analysis;
  try {
    analysis = SajuEngine.analyze({ calType: $('calType').value, y, m, d, h, mi, isLeap: $('isLeap').checked, timeUnknown });
  } catch (err) {
    $('formError').textContent = err.message || '날짜를 확인해 주세요. (음력 날짜가 존재하지 않을 수 있어요)';
    return;
  }
  analysis.summaryText = TextGenerator.generate(analysis);
  startAnalyzed(analysis);
});

/* ---------- STATE_ANALYZED ---------- */
function startAnalyzed(analysis) {
  app.analysis = analysis;
  app.party = PokemonGachaEngine.drawSix(analysis.elementsScore);
  app.results = [];
  app.numbers = new Set();
  setState('STATE_ANALYZED');

  renderSaju(analysis);
  $('sajuView').hidden = false;
  $('fortuneView').hidden = false;
  $('resultView').hidden = true;
  typewrite(analysis.summaryText);
  renderBalls();
  $('ballView').hidden = false;
  $('sajuView').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setState('STATE_GACHA_WAITING');
}

function renderSaju(a) {
  const ec = a.eightChar;
  const cols = [['시주', ec.time, a.timeUnknown], ['일주', ec.day], ['월주', ec.month], ['연주', ec.year]];
  $('pillars').innerHTML = cols.map(([cap, gz, empty]) => `
    <div class="pillar${empty ? ' empty' : ''}">
      <div class="cap">${cap}</div>
      ${empty ? '<span class="ch unknown">시각<br>모름</span>' :
        [...gz].map(c => `<span class="ch">${c}<small style="color:${ELEMENT_COLOR[SajuEngine.elementOf(c)]}">${SajuEngine.elementOf(c)}</small></span>`).join('')}
    </div>`).join('');

  $('bars').innerHTML = ELEMENTS.map(e => `
    <div class="bar">
      <span class="el-chip el-${e}" style="min-width:26px;height:26px;border-width:2px;font-size:13px">${e}</span>
      <div class="track"><div class="fill" data-w="${a.elementsScore[e]}" style="background:${ELEMENT_COLOR[e]}"></div></div>
      <span class="pct">${a.elementsScore[e].toFixed(1)}%${e === a.weeklyBonusElement ? '<br><span class="bonus">주간 +20</span>' : ''}</span>
    </div>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('#bars .fill').forEach(f => { f.style.width = `${f.dataset.w}%`; });
  }));

  $('metaLine').textContent =
    `${a.birthDate} · 가장 강한 기운 ${a.dominantElement} · ${a.weekly.year}년 ${a.weekly.week}주차 월요일 일진 ${a.weekly.gan} → 주간 보정 ${a.weeklyBonusElement}`;
}

function typewrite(text) {
  clearInterval(app.typingTimer);
  const out = $('fortuneText');
  out.textContent = '';
  $('caret').hidden = false;
  let i = 0;
  app.typingTimer = setInterval(() => {
    out.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(app.typingTimer); $('caret').hidden = true; }
  }, 35);
}

/* ---------- PokéBallGridView ---------- */
function renderBalls() {
  const grid = $('ballGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = `<span class="no">No.${i + 1}</span>`;
    const ball = document.createElement('button');
    ball.type = 'button';
    ball.className = 'ball';
    ball.setAttribute('aria-label', `${i + 1}번 몬스터볼 열기`);
    ball.innerHTML = POKEBALL_SVG;
    ball.addEventListener('click', () => openBall(i, slot, ball));
    slot.appendChild(ball);
    grid.appendChild(slot);
  }
}

let opening = false;
function openBall(ballIndex, slot, ball) {
  if (opening || ball.disabled) return;
  opening = true;
  ball.disabled = true;

  // STATE_BALL_OPENING: 클릭 순간의 타임스탬프 확보 → 번호 계산
  setState('STATE_BALL_OPENING');
  const timestamp = Date.now();
  const pokemon = app.party[ballIndex];
  const { lottoNumber } = LottoRngEngine.compute(pokemon.id, timestamp, app.numbers);
  app.results.push({ ballIndex, pokemon, timestamp, lottoNumber });

  ball.classList.add('shaking');
  setTimeout(() => {
    revealPokemon(slot, { pokemon, lottoNumber });
    opening = false;
    if (app.results.length === 6) complete();
    else setState('STATE_GACHA_WAITING');
  }, 600);
}

function revealPokemon(slot, { pokemon, lottoNumber }) {
  setState('STATE_POKEMON_REVEALED');
  slot.querySelector('.ball').remove();
  const box = document.createElement('div');
  box.className = 'reveal';
  box.appendChild(spriteImg(pokemon));
  box.insertAdjacentHTML('beforeend', `
    <span class="pid">#${String(pokemon.id).padStart(3, '0')} · ${TYPE_NAME[pokemon.type]}</span>
    <span class="pname">${pokemon.name} <span class="el-chip el-${pokemon.element}">${pokemon.element}</span></span>
    <span class="lotto bounce ${lottoClass(lottoNumber)}">${lottoNumber}</span>`);
  slot.appendChild(box);
}

/* ---------- STATE_COMPLETED / ResultCardView ---------- */
function sortedNumbers() { return app.results.map(r => r.lottoNumber).sort((a, b) => a - b); }

function complete() {
  setState('STATE_COMPLETED');
  const a = app.analysis;
  const now = new Date();
  $('resultWhen').textContent = `${a.weekly.year}년 ${a.weekly.week}주차 · ${now.toLocaleString('ko-KR')}`;
  $('resultNumbers').innerHTML = sortedNumbers().map(n => `<span class="lotto bounce ${lottoClass(n)}">${n}</span>`).join('');

  const party = $('resultParty');
  party.innerHTML = '';
  [...app.results].sort((x, y) => x.ballIndex - y.ballIndex).forEach(r => {
    const mon = document.createElement('div');
    mon.className = 'mon';
    mon.appendChild(spriteImg(r.pokemon));
    mon.insertAdjacentHTML('beforeend', `<b>${r.pokemon.name}</b>${r.pokemon.element} · ${r.lottoNumber}번`);
    party.appendChild(mon);
  });
  $('resultSummary').textContent = `「${a.summaryText}」`;

  ['copyBtn', 'shareBtn', 'saveBtn', 'retryBtn'].forEach(id => { $(id).disabled = false; });
  app.cardBlob = null;
  setTimeout(() => resultBlob().catch(() => {}), 1200);   // 번호 애니메이션 이후 미리 렌더링
  $('resultView').hidden = false;
  setTimeout(() => $('resultView').scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
}

function toast(msg) {
  $('toast').textContent = msg;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { $('toast').textContent = ''; }, 2500);
}

$('copyBtn').addEventListener('click', async () => {
  const text = sortedNumbers().join(', ');
  try {
    await navigator.clipboard.writeText(text);
    toast(`복사했어요: ${text}`);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? `복사했어요: ${text}` : `복사에 실패했어요. 번호: ${text}`);
  }
});

async function toDataUrl(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`sprite ${res.status}`);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

/** 결과 카드를 PNG Blob으로 렌더링 (저장·공유 공용) */
async function renderResultBlob() {
  if (typeof html2canvas === 'undefined') throw new Error('html2canvas not loaded');
  // PokemonDB 스프라이트는 CORS 헤더가 없어 캔버스에 그릴 수 없음 → PokeAPI 스프라이트를 data URL로 받아 교체
  const urls = [...new Set([...$('resultCard').querySelectorAll('img')].map(img => img.dataset.fallback))];
  const dataUrls = Object.fromEntries(await Promise.all(urls.map(async u => [u, await toDataUrl(u)])));
  const canvas = await html2canvas($('resultCard'), {
    backgroundColor: '#f4efd8', scale: 2,
    onclone: doc => {
      doc.querySelectorAll('#resultCard img').forEach(img => {
        img.removeAttribute('srcset');
        img.src = dataUrls[img.dataset.fallback];
      });
      // 복제본에서는 애니메이션이 처음(opacity 0)부터 다시 시작되므로 끈다
      doc.querySelectorAll('#resultCard .bounce').forEach(el => el.classList.remove('bounce'));
      // html2canvas는 inset box-shadow를 반투명 덮개처럼 그려 공 색이 흐려지므로 제거
      doc.querySelectorAll('#resultCard .lotto').forEach(el => { el.style.boxShadow = 'none'; });
    },
  });
  return new Promise((resolve, reject) => canvas.toBlob(b => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png'));
}

/** 완료 시점에 미리 만들어 둔 이미지 (모바일 공유 시트는 클릭 직후에 열어야 하므로 선계산) */
function resultBlob() {
  if (!app.cardBlob) app.cardBlob = renderResultBlob().catch(err => { app.cardBlob = null; throw err; });
  return app.cardBlob;
}

const resultFileName = () => `pocketmon-lotto-${sortedNumbers().join('-')}.png`;

function shareText() {
  const names = [...app.results].sort((x, y) => x.ballIndex - y.ballIndex).map(r => r.pokemon.name).join(', ');
  return `[오행 픽셀 포켓몬 로또]\n이번 주 행운의 번호: ${sortedNumbers().join(', ')}\n함께한 포켓몬: ${names}`;
}

$('saveBtn').addEventListener('click', async () => {
  $('saveBtn').disabled = true;
  try {
    const url = URL.createObjectURL(await resultBlob());
    const link = document.createElement('a');
    link.download = resultFileName();
    link.href = url;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('이미지를 저장했어요.');
  } catch (err) {
    console.error(err);
    toast('이미지 저장에 실패했어요.');
  } finally {
    $('saveBtn').disabled = false;
  }
});

$('shareBtn').addEventListener('click', async () => {
  const text = shareText();
  const pageUrl = /^https?:/.test(location.protocol) ? location.href : undefined;
  try {
    if (navigator.share) {
      let file = null;
      try { file = new File([await resultBlob()], resultFileName(), { type: 'image/png' }); } catch (e) { console.error(e); }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text, title: '오행 픽셀 포켓몬 로또' });
      } else {
        await navigator.share({ text, url: pageUrl, title: '오행 픽셀 포켓몬 로또' });
      }
      return;
    }
    // 공유 기능이 없는 환경(PC 브라우저, file:// 등) → 텍스트 복사로 대체
    await navigator.clipboard.writeText(pageUrl ? `${text}\n${pageUrl}` : text);
    toast('공유 기능이 없는 브라우저라 결과 문구를 복사했어요.');
  } catch (err) {
    if (err && err.name === 'AbortError') return;   // 사용자가 공유 창을 닫음
    console.error(err);
    toast('공유에 실패했어요.');
  }
});
$('retryBtn').addEventListener('click', () => {
  clearInterval(app.typingTimer);
  ['sajuView', 'fortuneView', 'ballView', 'resultView'].forEach(id => { $(id).hidden = true; });
  ['copyBtn', 'shareBtn', 'saveBtn', 'retryBtn'].forEach(id => { $(id).disabled = true; });
  app.cardBlob = null;
  app.analysis = null; app.party = []; app.results = []; app.numbers = new Set();
  setState('STATE_INIT');
  $('formView').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
